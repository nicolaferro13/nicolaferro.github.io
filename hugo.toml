baseURL = 'https://nicolaferro13.github.io/nicolaferro.github.io/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
theme = 'hugo-theme-spectra'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'
  series = 'series'

[params]
  # === Content Limits ===
  homepagePostsLimit = 10
  cardSummaryLength = 150
  relatedPostsLimit = 3
  cardImageQuality = 80
  coverImageQuality = 85
  # contentImageQuality = 90         # 內文圖片壓縮品質（1-100，需搭配 imageOptimize = true，預設已開啟）

  # === Banner Text (uncomment to customize) ===
  # bannerTitle = 'My'
  # bannerHighlight = 'Tech Notes'
  # bannerSubtitle = '// blog × code × ideas'

  # === Feature Toggles (default: true, set false to disable) ===
  enableLoadingAnimation = true
  enableMouseGlow = true
  showBanner = true
  showReadingProgress = true
  enableLightbox = true
  showScrollTop = true
  enableSearch = true
  showRelatedPosts = true
  showSeriesNav = true
  enableCodeCopy = true
  enableScrollAnimation = true

  # === Share ===
  sharePlatforms = ['twitter', 'facebook', 'linkedin']

  # === Advanced: Custom CSS/JS ===
  # customCSS = ['css/custom.css']
  # customJS = ['js/custom.js']
  # googleFontsURL = 'https://fonts.googleapis.com/css2?family=...'

  # === Style Overrides ===
  [params.style]
    colorAccent = '#4a7de0'
    colorAccentWarm = '#e8609e'
    colorAccentSoft = '#a78bfa'
    fontDisplay = "'Outfit', sans-serif"
    fontBody = "'Zen Maru Gothic', 'Noto Sans TC', sans-serif"
    fontMono = "'JetBrains Mono', monospace"
    bannerImageText = '#fff'
    # bannerImageSubtitle = 'rgba(255, 255, 255, 0.8)'
    bannerImageGradient = 'linear-gradient(135deg, #4a7de0, #e8609e)'
    bannerImageGradientFill = 'transparent'

  [params.sidebar]
    showAllPosts = true
    showCategories = true
    showTags = true
    showRecent = true
    categoryLimit = 5
    tagsLimit = 20
    recentLimit = 5
    # tagWarmThreshold = 3   # 文章數 >= 此值的標籤顯示粉色（不設定則自動計算）

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false
    lineNos = false
    lineNumbersInTable = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$']]

# ============================================
# Languages
# ============================================

[languages]

  [languages.en]
    languageCode = 'en'
    languageName = 'English'
    weight = 1
    title = ''

    [languages.en.params]
      description = ''
      author = 'Nicola Ferro'
      tagline = 'Reach out!'
      bio = ''
      bannerSubtitle = 'Energy and Nuclear Engineer'

      [[languages.en.params.social]]
        name = "GitHub"
        url = "https://github.com/nicolaferro13"
      [[languages.en.params.social]]
        name = "LinkedIn"
        url = "https://www.linkedin.com/in/-nicolaferro/"
      [[languages.en.params.social]]
        name = "email"
        url = "mailto:ferro.nicola@outlook.com"

    [[languages.en.menus.main]]
      name = "Home"
      pageRef = "/"
      weight = 1
      pre = "⌂"
    [[languages.en.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 2
      pre = "◉"
    [[languages.en.menus.main]]
      name = "Posts"
      pageRef = "/posts"
      weight = 3
      pre = "✎"


   [languages.it]
     languageCode = 'it'
     languageName = 'Italiano'
     weight = 2
     title = ''

     [languages.it.params]
       description = ''
       author = 'Nicola Ferro'
       tagline = 'Contattami!'
       bio = ''
       #banner = '/images/demo02.jpg'
       #avatar = '/images/avatar.webp'
       bannerSubtitle = 'Ingegnere Energetico e Nucleare'

       [[languages.it.params.social]]
         name = "GitHub"
         url = "https://github.com/nicolaferro13"
       [[languages.it.params.social]]
         name = "LinkedIn"
         url = "https://www.linkedin.com/in/-nicolaferro/"
       [[languages.it.params.social]]
        name = "email"
        url = "mailto:ferro.nicola@outlook.com"

    # -- Navigation Menu --
     [[languages.it.menus.main]]
       name = "Home"
       pageRef = "/"
       weight = 1
       pre = "⌂"
     [[languages.it.menus.main]]
       name = "Chi sono"
       pageRef = "/about"
       weight = 2
       pre = "◉"
     [[languages.it.menus.main]]
       name = "Post"
       pageRef = "/posts"
       weight = 3
       pre = "✎"


[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
